name: FMO Luau Runtime CI

on:
  push:
    branches: [Runtime, "hardening/**"]
  pull_request:
    branches: [Runtime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fmo-luau-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-test:
    name: Build Luau and run regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python sources
        run: python -m compileall -q .

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Build official Luau CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git "$RUNNER_TEMP/luau"
          cmake -S "$RUNNER_TEMP/luau" -B "$RUNNER_TEMP/luau/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/luau/build" --target Luau.Repl.CLI --parallel 2
          test -x "$RUNNER_TEMP/luau/build/luau"

      - name: Run FMO Super Test 1.2
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/luau/build/luau" scripts/test.luau
